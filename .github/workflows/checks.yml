name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_target:
        description: "Select none for CI-only checks; production requires separately reviewed QA."
        type: choice
        required: true
        default: none
        options:
          - none
          - production
      confirm_live_e2e:
        description: "I approve creation and deletion of two synthetic users/PDF on the production project."
        type: boolean
        required: true
        default: false
      acknowledgment:
        description: "Type RUN_SYNTHETIC_LIVE_E2E to allow the production QA test."
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && pytest
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm install
      - name: Validate persistent project progress ledger
        run: node ../scripts/check-project-progress.mjs
      - run: npm run lint
      - run: npm run build

  api-readonly-live:
    name: Live API HTTPS preflight (GET only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # No repository secrets. Fixed public hostname, fixed GET routes.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert live API health and deny anonymous job-status access
        run: python backend/scripts/read_only_release_probe.py

  browser-qa:
    name: Browser QA — local synthetic accounts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      PAPERSIGNAL_BROWSER_QA: "1"
      PAPERSIGNAL_BROWSER_QA_URL: http://localhost:3000
      PAPERSIGNAL_BROWSER_QA_MOCKS: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_qa_only
      NEXT_PUBLIC_API_URL: http://127.0.0.1:54322
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install pinned app and browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Run isolated Chromium/WebKit browser workflows
        run: bash scripts/test-browser-ci.sh

  db-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run real baseline schema + beta permission checks against disposable PostgreSQL 17
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres < supabase/tests/bootstrap_beta_grant_fixture.sql
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres < supabase/migrations/20261113000000_initial_schema.sql
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres < supabase/migrations/20261113010000_analysis_jobs.sql
          # Existing Supabase service_role has these grants through platform defaults.
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON public.analysis_jobs TO service_role;'
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres < supabase/migrations/20261117215315_beta_server_owned_result_writes.sql
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres < supabase/tests/verify_beta_write_isolation.sql

  live-e2e:
    # Secrets and production mutations are allowed ONLY by explicit opt-in on
    # the protected main branch. All PR and ordinary dispatch runs skip this job.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.e2e_target == 'production' &&
      inputs.confirm_live_e2e == true &&
      inputs.acknowledgment == 'RUN_SYNTHETIC_LIVE_E2E'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPERSIGNAL_E2E_ENABLED: "1"
      PAPERSIGNAL_E2E_APPROVED: RUN_SYNTHETIC_LIVE_E2E
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PAPERSIGNAL_API_URL: ${{ secrets.PAPERSIGNAL_API_URL }}
      E2E_TIMEOUT_SECONDS: "900"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Verify explicit live E2E approval and strict target allowlist
        run: |
          python - <<'PY'
          import os
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "papersignal_live_e2e", "backend/tests/test_live_e2e.py"
          )
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module._validate_live_e2e_target(
              os.getenv("SUPABASE_URL", "").rstrip("/"),
              os.getenv("PAPERSIGNAL_API_URL", "").rstrip("/"),
              os.getenv("PAPERSIGNAL_E2E_APPROVED", ""),
          )
          print("Live E2E target/approval preflight accepted. No private values printed.")
          PY
      - run: cd backend && pytest -q tests/test_live_e2e.py
