name: Checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/**"
      - "frontend/**"
      - "supabase/**"
      - ".github/workflows/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "Dockerfile"
      - "railway.json"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest check for each PR. A newer commit cancels stale work.
concurrency:
  group: papersignal-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --prefer-binary -r backend/requirements-dev.txt
      - run: cd backend && pytest
      - name: Start candidate API locally with synthetic credentials and verify HTTP/auth boundary
        run: cd backend && python scripts/smoke_candidate_http.py

  db-policy:
    name: Supabase migration and ownership contracts — disposable PostgreSQL
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bootstrap minimal Supabase Auth and Storage contracts
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres < supabase/tests/bootstrap_beta_grant_fixture.sql
      - name: Apply the exact recorded migration sequence to disposable PostgreSQL
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          apply_sql() { docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres < "$1"; }
          apply_sql supabase/migrations/20261112155952_initial_paper_analysis_schema.sql
          apply_sql supabase/migrations/20261112160036_authenticated_analysis_writes.sql
          docker exec -i "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON public.analysis_jobs TO service_role;'
          apply_sql supabase/migrations/20261113021557_analysis_jobs_async_queue.sql
          apply_sql supabase/migrations/20261113161739_worker_leases_heartbeat_and_retry_rpc.sql
          apply_sql supabase/tests/verify_worker_lease_contract.sql
          apply_sql supabase/migrations/20261113222551_analysis_stage_checkpoints_and_idempotent_results.sql
          apply_sql supabase/migrations/20261113222605_make_analysis_job_id_unique_for_upsert.sql
          apply_sql supabase/migrations/20261113222644_index_analysis_job_foreign_keys.sql
          apply_sql supabase/migrations/20261113222754_explicit_service_role_checkpoint_policy.sql
          apply_sql supabase/migrations/20261113234956_cleanup_terminal_analysis_job_checkpoints.sql
          # Verify trusted server enqueue while legacy client grants are still present.
          apply_sql supabase/tests/verify_pre_revoke_server_enqueue.sql
          # Match Production ordering: close client write paths, then install quota and ledger.
          apply_sql supabase/migrations/20261120102957_beta_server_owned_result_writes.sql
          apply_sql supabase/migrations/20261120122747_server_owned_analysis_quota.sql
          apply_sql supabase/tests/verify_analysis_queue_quota.sql
          apply_sql supabase/migrations/20261120122819_ai_usage_events_ledger.sql
          apply_sql supabase/migrations/20261120122859_index_ai_usage_ledger_foreign_keys.sql
          apply_sql supabase/tests/verify_ai_usage_events_ledger.sql
          apply_sql supabase/tests/verify_beta_write_isolation.sql

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://hwmtayrecsfxernhssro.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_papersignal_e2e_mock
      NEXT_PUBLIC_API_URL: https://api.mock.papersignal.test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      # There is no package-lock.json in this repository yet; cache npm's
      # package tarballs/metadata instead of setup-node's lockfile cache.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-
      - run: npm install --prefer-offline --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
