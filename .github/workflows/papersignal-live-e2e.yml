name: PaperSignal Live E2E - Manual Approval
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Production synthetic fixture test. Disabled unless explicitly selected."
        required: true
        type: choice
        options:
          - disabled
          - papersignal-production
        default: disabled
      approve_mutations:
        description: "Approve two temporary Auth users, one synthetic PDF, a real analysis job and exact fixture cleanup."
        required: true
        type: boolean
        default: false
      approved_commit:
        description: "Reviewed immutable SHA of the E2E source, copied from this workflow's runbook."
        required: true
        type: string
        default: ""
      acknowledgment:
        description: "Type RUN_SYNTHETIC_LIVE_E2E to explicitly approve this run."
        required: true
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: papersignal-live-e2e-production
  cancel-in-progress: false
jobs:
  live-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'papersignal-production' &&
      inputs.approve_mutations == true &&
      inputs.approved_commit == '431059a1116a50f39fd56d565c35a1afc081b8fc' &&
      inputs.acknowledgment == 'RUN_SYNTHETIC_LIVE_E2E'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed E2E-only release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 431059a1116a50f39fd56d565c35a1afc081b8fc
          persist-credentials: false
      - name: Verify immutable source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '431059a1116a50f39fd56d565c35a1afc081b8fc'
          test -f backend/tests/test_live_e2e.py
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install reviewed Python requirements without privileged environment
        run: pip install -r backend/requirements-dev.txt
      - name: Check target allowlist and upgraded API without mutations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAPERSIGNAL_API_URL: ${{ secrets.PAPERSIGNAL_API_URL }}
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import httpx
          source = 'backend/tests/test_live_e2e.py'
          spec = importlib.util.spec_from_file_location('papersignal_audited_e2e', source)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          required = ('SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_SERVICE_ROLE_KEY','PAPERSIGNAL_API_URL')
          if not all(os.environ.get(name, '').strip() for name in required):
              raise RuntimeError('Missing required protected GitHub repository E2E secrets; no mutation occurred.')
          supabase = os.environ['SUPABASE_URL'].rstrip('/')
          api_origin = os.environ['PAPERSIGNAL_API_URL'].rstrip('/')
          module._validate_live_e2e_target(supabase, api_origin, module.LIVE_E2E_ACKNOWLEDGMENT)
          with httpx.Client(base_url=api_origin, timeout=15) as api:
              module._assert_server_ready_for_live_e2e(api)
          print('PAPERSIGNAL_LIVE_E2E_PREFLIGHT_PASS: approved exact targets and server-owned API')
          PY
      - name: Run approved two-account synthetic E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAPERSIGNAL_API_URL: ${{ secrets.PAPERSIGNAL_API_URL }}
          PAPERSIGNAL_E2E_APPROVED: RUN_SYNTHETIC_LIVE_E2E
          PAPERSIGNAL_E2E_ENABLED: "1"
          E2E_TIMEOUT_SECONDS: "900"
        run: >-
          pytest -q backend/tests/test_live_e2e.py
          -k test_live_auth_upload_analysis_and_cross_user_isolation
          --tb=short
